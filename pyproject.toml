[project]
name = "physical-ai-go2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genesis-world>=1.4.5",
    "rsl-rl-lib>=5",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[project.scripts]
physical-ai-go2 = "physical_ai_go2:main"
go2-train-walk = "physical_ai_go2.training.train_walk:main"
go2-train-jump = "physical_ai_go2.training.train_jump:main"
go2-train-walk-jump = "physical_ai_go2.training.train_walk_jump:main"
go2-teleop = "physical_ai_go2.control.teleop:main"
go2-make-video = "physical_ai_go2.video.make_video:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
