[project]
name = "physical-ai-go2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genesis-world>=1.4.5",
    "rsl-rl-lib>=5",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[project.scripts]
go2-train-walk = "training.train_walk:main"
go2-train-jump = "training.train_jump:main"
go2-train-walk-jump = "training.train_walk_jump:main"
go2-teleop = "control.teleop:main"
go2-make-video = "video.make_video:main"
go2-make-key-demo-video = "video.make_key_demo_video:main"
go2-make-jump-demo-video = "video.make_jump_demo_video:main"
go2-make-walk-jump-demo-video = "video.make_walk_jump_demo_video:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["control", "environment", "training", "video"]
